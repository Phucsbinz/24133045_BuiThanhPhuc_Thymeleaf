spring.application.name=category-studio
server.port=${PORT:8088}
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/thymeleaf_category?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=UTF-8}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.thymeleaf.cache=false
server.error.include-message=never
app.student-photo=${STUDENT_PHOTO:/images/student-placeholder.svg}
